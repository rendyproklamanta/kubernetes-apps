---
image:
  tag: v3.5.0

logs:
  general:
    level: DEBUG
  access:
    enabled: true
    format: json
    fields:
      headers: 
        defaultmode: keep

deployment:
  enabled: true
  kind: DaemonSet
  terminationGracePeriodSeconds: 0

tolerations:
  - key: "node.kubernetes.io/unreachable"
    operator: "Exists"
    effect: "NoExecute"
    tolerationSeconds: 0
  - key: "node.kubernetes.io/not-ready"
    operator: "Exists"
    effect: "NoExecute"
    tolerationSeconds: 0

ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik

# ACME internal dimatikan
certificatesResolvers: {}

# Non-persistent, supaya DaemonSet bisa jalan di semua node
persistence:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Create an IngressRoute for the dashboard
ingressRoute:
  dashboard:
    enabled: true
    # Custom match rule with host domain
    matchRule: Host(`192.168.1.0`)
    entryPoints: ["web"]
    middlewares:
      - name: traefik-dashboard-auth

# Create the custom middlewares used by the IngressRoute dashboard (can also be created in another way).
# /!\ Yes, you need to replace "traefikdash" password with a better one. /!\
extraObjects:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: traefik-dashboard-auth-secret
    type: kubernetes.io/basic-auth
    stringData:
      username: admin
      password: traefikdash

  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: traefik-dashboard-auth
    spec:
      basicAuth:
        secret: traefik-dashboard-auth-secret

experimental:
  plugins:
    # bouncer:
    #   moduleName: "github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
    #   version: "v1.3.0"