---
image:
  tag: "v2.11.0"

logs:
  general:
    level: DEBUG
  access:
    enabled: true
    format: json
    fields:
      headers:
        defaultmode: keep

deployment:
  enabled: true
  kind: Deployment
  replicas: 2
  terminationGracePeriodSeconds: 0

podDisruptionBudget:
  enabled: true
  minAvailable: 1
  
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
          topologyKey: kubernetes.io/hostname

# Konfigurasi Service LoadBalancer
service:
  enabled: true
  type: LoadBalancer
  # Jika di cloud (AWS/GCP/Azure) dan butuh anotasi khusus, tambahkan di bawah ini:
  annotations: {}
    # Contoh untuk AWS NLB:
    # service.beta.kubernetes.io/aws-load-balancer-type: "nlb"

tolerations:
  - key: "node.kubernetes.io/unreachable"
    operator: "Exists"
    effect: "NoExecute"
    tolerationSeconds: 0
  - key: "node.kubernetes.io/not-ready"
    operator: "Exists"
    effect: "NoExecute"
    tolerationSeconds: 0

# Create an IngressRoute for the dashboard
ingressRoute:
  dashboard:
    enabled: true
    # Custom match rule with host domain
    matchRule: Host(`192.168.1.0`)
    entryPoints: ["web"]
    middlewares:
      - name: traefik-dashboard-auth

# Create the custom middlewares used by the IngressRoute dashboard (can also be created in another way).
# /!\ Yes, you need to replace "changeme" password with a better one. /!\
extraObjects:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: traefik-dashboard-auth-secret
    type: kubernetes.io/basic-auth
    stringData:
      username: admin
      password: traefikdash

  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: traefik-dashboard-auth
    spec:
      basicAuth:
        secret: traefik-dashboard-auth-secret

  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: redirect-https
    spec:
      redirectScheme:
        scheme: https
        permanent: true

